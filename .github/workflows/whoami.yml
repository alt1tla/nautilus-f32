# One-off diagnostic: identify which Microsoft identity owns the stored
# VSCE_PAT (and therefore the Marketplace publisher). Manual trigger only;
# prints display name + masked email — never the token.
name: whoami
on: workflow_dispatch
jobs:
  pat-owner:
    runs-on: ubuntu-latest
    steps:
      - name: Identify VSCE_PAT owner (masked)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          mask() { sed -E 's/([[:alnum:]])[[:alnum:]._-]*@([[:alnum:]])[[:alnum:].-]*(\.[[:alpha:]]+)/\1***@\2***\3/g'; }
          echo "--- connectionData ---"
          curl -s -u ":$VSCE_PAT" "https://app.vssps.visualstudio.com/_apis/connectionData" \
            | jq '.authenticatedUser | {providerDisplayName, customDisplayName, properties}' | mask
          echo "--- profile/me ---"
          curl -s -u ":$VSCE_PAT" "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=7.1-preview.3" \
            | jq 'if .displayName then {displayName, emailAddress, coreEmail: .coreAttributes.EmailAddress.value} else . end' | mask
          echo "--- publisher joyautomation (PAT auth) ---"
          curl -s -u ":$VSCE_PAT" "https://marketplace.visualstudio.com/_apis/gallery/publishers/joyautomation?api-version=7.1-preview.1" \
            | jq '{publisherName, displayName, flags, domain, isDomainVerified, extensions: [.extensions[]? | {extensionName, flags}]}' | mask
          echo "--- extension vscode-iec (PAT auth, incl. hidden) ---"
          curl -s -u ":$VSCE_PAT" "https://marketplace.visualstudio.com/_apis/gallery/publishers/joyautomation/extensions/vscode-iec?api-version=7.1-preview.1&flags=1" \
            | jq 'if .extensionName then {extensionName, flags, lastUpdated, publishedDate, versions: [.versions[]? | {version, flags, lastUpdated}]} else . end' | mask
