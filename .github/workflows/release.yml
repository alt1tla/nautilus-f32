name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  # CLI binaries → GitHub Release. Needs no secrets beyond the automatic
  # GITHUB_TOKEN, so this works the moment you push a tag.
  cli:
    name: CLI binaries (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A convenience VSIX attached to the Release, built at the extension's own
  # package.json version. Registry publishing (Marketplace / Open VSX / npm)
  # is NOT tag-driven — it happens from main via publish.yml whenever a
  # package.json version bump lands. See RELEASING.md.
  extension:
    name: VS Code extension (VSIX on the Release)
    runs-on: ubuntu-latest
    needs: cli # the Release must exist before we upload the VSIX to it
    defaults:
      run:
        working-directory: tools/vscode-iec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run compile
      - name: Package VSIX
        run: |
          # VS Code convention: odd minor = pre-release channel, even = stable.
          minor=$(node -p "require('./package.json').version.split('.')[1]")
          pre=""
          if [ $((minor % 2)) -eq 1 ]; then pre="--pre-release"; fi
          npx --yes @vscode/vsce package $pre
      - name: Attach VSIX to the Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
